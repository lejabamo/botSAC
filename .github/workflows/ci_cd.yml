name: BotSAC CI/CD Pipeline

on:
  push:
    branches: [ main, version-2.0 ]
  pull_request:
    branches: [ main, version-2.0 ]

jobs:
  # ============================================================================
  # 1. SEGURIDAD Y SANITIZACIÓN
  # ============================================================================
  security-audit:
    name: 🛡️ Auditoría de Seguridad y Sanitización
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar ausencia de archivos .env y secretos en el árbol Git
        run: |
          echo "Verificando que no se hayan comiteado archivos .env con credenciales..."
          if git ls-files | grep -E '^\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "❌ ERROR: Se detectó un archivo .env en Git. Abortando CI/CD por seguridad."
            exit 1
          fi
          echo "✓ Sanitización verificada: ningún archivo .env presente en el control de versiones."

      - name: Validar existencia de .env.example
        run: |
          if [ ! -f .env.example ]; then
            echo "❌ ERROR: .env.example no encontrado."
            exit 1
          fi
          echo "✓ Plantilla .env.example presente y estructurada."

  # ============================================================================
  # 2. INTEGRACIÓN CONTINUA: BACKEND (FastAPI + Python)
  # ============================================================================
  backend-ci:
    name: 🐍 Backend Lint, Compilación e Integridad
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilación y validación de sintaxis
        run: |
          echo "Compilando módulos Python para verificar ausencia de errores de sintaxis..."
          python -m compileall app backend botsac scripts

      - name: Validación de integridad de módulos core
        run: |
          echo "Validando importaciones e integridad de módulos de producción..."
          python -c "import app.api; import backend.oracle_service; import backend.canonical_etl; print('✓ Módulos core importados y validados correctamente')"

  # ============================================================================
  # 3. INTEGRACIÓN CONTINUA: FRONTEND (React + Vite + TypeScript)
  # ============================================================================
  frontend-ci:
    name: ⚛️ Frontend Typecheck y Build de Producción
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Instalar dependencias frontend
        working-directory: ./frontend
        run: |
          npm install

      - name: Typecheck y compilación de producción (tsc + vite build)
        working-directory: ./frontend
        run: |
          npm run build

      - name: Archivar bundle compilado dist/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================================
  # 4. ENTREGA Y EMPAQUETADO PARA MÁQUINA VIRTUAL (CD / Packaging)
  # ============================================================================
  package-release:
    name: 📦 Empaquetado de Release para Despliegue en VM
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/version-2.0') && github.event_name == 'push'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descargar bundle compilado de Frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release_bundle/frontend_dist

      - name: Ensamblar paquete productivo sanitizado
        run: |
          mkdir -p release_bundle/app
          mkdir -p release_bundle/backend
          mkdir -p release_bundle/botsac
          mkdir -p release_bundle/scripts
          mkdir -p release_bundle/docs

          # Copiar código fuente backend
          cp -r app/* release_bundle/app/
          cp -r backend/* release_bundle/backend/
          cp -r botsac/* release_bundle/botsac/
          cp -r scripts/* release_bundle/scripts/

          # Copiar archivos base
          cp requirements.txt release_bundle/
          cp .env.example release_bundle/
          cp docker-compose.yml release_bundle/
          cp deploy_vm.sh release_bundle/
          cp Dockerfile release_bundle/
          cp launch_app.bat release_bundle/ || true

          # Copiar guías de despliegue
          cp *.md release_bundle/docs/ || true

          # Comprimir bundle de despliegue
          tar -czf botsac-enterprise-v2-vm-release.tar.gz -C release_bundle .
          echo "✓ Paquete de release v2.0 para VM generado: botsac-enterprise-v2-vm-release.tar.gz"

      - name: Publicar artefacto de despliegue para la VM
        uses: actions/upload-artifact@v4
        with:
          name: botsac-enterprise-v2-vm-release
          path: botsac-enterprise-v2-vm-release.tar.gz
          retention-days: 14
